services:
  - type: web
    name: link-player-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_USER_IDS
        value: ""
